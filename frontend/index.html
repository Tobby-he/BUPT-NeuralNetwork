<!DOCTYPE html>
<html>
<head>
    <title>图像描述生成</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>图像描述生成</h1>
        <div class="upload-container">
            <div class="drop-zone" id="drop-zone">
                <input type="file" id="imageInput" accept="image/*">
                <p>点击或拖拽图片到此处</p>
                <p class="drag-hint">支持拖拽、点击上传和粘贴图片</p>
            </div>
        </div>
        <div class="control-section">
            <select id="modelSelect" class="model-select">
                <option value="cnn_gru">CNN-GRU</option>
                <option value="vit_transformer">ViT-Transformer</option>
            </select>
            <button class="generate-btn" onclick="generateDescription()">生成描述</button>
        </div>
        <div class="preview-section">
            <img id="imagePreview" style="display: none;">
            <div id="loadingIndicator" style="display: none;">正在生成描述...</div>
            <div id="errorMessage" style="display: none;"></div>
            <div id="description" class="result"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
